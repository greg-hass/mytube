name: Docker Build & Push

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Reject tracked environment files
        run: bash scripts/check-no-tracked-env.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefer-offline

      - name: Restore server dependencies
        id: server-dependencies
        uses: actions/cache@v6
        with:
          path: server/node_modules
          key: server-node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('server/package.json', 'server/package-lock.json') }}

      - name: Install server dependencies
        if: steps.server-dependencies.outputs.cache-hit != 'true'
        working-directory: server
        run: npm ci --prefer-offline

      - name: Type-check frontend
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test frontend and server with coverage gates
        run: npm run test:coverage

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev

      - name: Audit server production dependencies
        working-directory: server
        run: npm audit --omit=dev

  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefer-offline

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Restore Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test development startup
        run: npm run test:dev

      - name: Test production browser flows
        run: npm run test:e2e

      - name: Verify deterministic performance budgets
        run: npm run check:performance

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            output/qa/*/playwright/
            output/qa/*/report/
            output/qa/*/server.log
            output/performance/check-*.json
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose configuration
        run: SERVER_API_TOKEN=ci-validation-token docker compose config --quiet
      - name: Smoke test production container
        run: bash scripts/container-smoke.sh
      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-evidence
          path: output/container/
          retention-days: 7

  publish:
    needs: [browser, quality, secrets, container]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_ID=${{ github.sha }}
            GIT_REVISION=${{ github.sha }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
